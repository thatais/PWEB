<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atividade 9 - Funções</title>
</head>
<body>
    <h1>Atividade 9 - Funções</h1>

    <h2>1) Maior de três números</h2>
    <input type="number" id="maiorNum1">
    <input type="number" id="maiorNum2">
    <input type="number" id="maiorNum3">
    <button type="button" onclick="testarMaior()">Verificar</button>
    <p id="resultadoMaior"></p>

    <h2>2) Três números em ordem crescente</h2>
    <input type="number" id="ordemNum1">
    <input type="number" id="ordemNum2">
    <input type="number" id="ordemNum3">
    <button type="button" onclick="testarOrdem()">Ordenar</button>
    <p id="resultadoOrdem"></p>

    <h2>3) Palíndromo</h2>
    <input type="text" id="textoPalindromo" placeholder="Digite um texto">
    <button type="button" onclick="testarPalindromo()">Verificar</button>
    <p id="resultadoPalindromo"></p>

    <h2>4) Subconjunto</h2>
    <input type="text" id="palavra1" placeholder="Primeira palavra">
    <input type="text" id="palavra2" placeholder="Segunda palavra">
    <button type="button" onclick="testarSubconjunto()">Verificar</button>
    <p id="resultadoSubconjunto"></p>

    <h2>5) Dia da semana</h2>
    <input type="text" id="data" placeholder="dd/mm/aaaa" maxlength="10">
    <button type="button" onclick="testarDiaSemana()">Verificar</button>
    <p id="resultadoData"></p>

    <script src="atividade9.js"></script>
</body>
</html>
